pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases'
        }
    }
}

plugins {
    // 为 Java 21 工具链提供 NeoForge 模板所需的解析支持。
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

// 使用独立的 1.21.1 NeoForge 子项目名称。
rootProject.name = 'eyes-of-waypoints-1.21.1-neoforge'
