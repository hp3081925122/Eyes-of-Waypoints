plugins {
    // 使用 Java、IDE 和 NeoForge ModDev 插件构建当前版本项目。
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

// 保持模组坐标与主包命名一致。
group = mod_group_id
version = mod_version

// 保持正式 JAR 的基础名称稳定。
base {
    archivesName = mod_id
}

// 1.21.1 NeoForge 使用 Java 21 工具链。
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// 声明当前项目唯一的 NeoForge 开发运行时和模组源集。
neoForge {
    version = neo_version

    runs {
        // 配置客户端开发运行环境。
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        // 配置专用服务端开发运行环境。
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        // 为所有运行环境统一指定目标目录和日志级别。
        configureEach {
            gameDirectory = project.file('run')
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    // 将主源集交给 NeoForge 运行时加载。
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// 解析 NeoForge 开发依赖与 Xaero's Minimap 编译依赖。
repositories {
    maven {
        name = 'NeoForge'
        url = 'https://maven.neoforged.net/releases'
    }
    // 使用 CurseMaven 获取 1.21.1 NeoForge 版 Xaero's Minimap。
    maven { url = 'https://cursemaven.com' }
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // 仅把 Xaero 作为外部必需模组接入，不将其打包进本模组 JAR。
    implementation "curse.maven:xaeros-minimap-263420:${xaeros_minimap_file_id}"
    // 使用 1.21.1 NeoForge 版 L_Ender's Cataclysm 的公开物品和结构标签。
    implementation "curse.maven:lendercataclysm-551586:${lendercataclysm_file_id}"
}

// 处理 NeoForge 模组元数据并固定资源编码。
tasks.named('processResources', ProcessResources).configure {
    filteringCharset = 'UTF-8'

    def replaceProperties = [
            minecraft_version           : minecraft_version,
            minecraft_version_range     : minecraft_version_range,
            neo_version                 : neo_version,
            neo_version_range           : neo_version_range,
            loader_version_range        : loader_version_range,
            xaeros_minimap_version_range: xaeros_minimap_version_range,
            lendercataclysm_version_range: lendercataclysm_version_range,
            mod_id                      : mod_id,
            mod_name                    : mod_name,
            mod_license                 : mod_license,
            mod_version                 : mod_version,
            mod_authors                 : mod_authors,
            mod_description             : mod_description
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// 为正式 JAR 写入稳定的模组实现信息。
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// 使用 UTF-8 编译 Java 源码，并关闭 JavaExec 的模块路径推断。
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(JavaExec).configureEach {
    modularity.inferModulePath = false
}
